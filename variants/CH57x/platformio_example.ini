[platformio]
default_envs = ch570_evt

[env:ch570_evt]
platform = ch32v
board = ch570
framework = arduino
monitor_speed = 115200
build_flags = 
    -DSYSCLK_FREQ_100MHz_HSI=100000000 
    -DF_CPU=100000000

[env:ch572_evt]
platform = ch32v
board = ch572
framework = arduino
monitor_speed = 115200
build_flags = 
    -DSYSCLK_FREQ_100MHz_HSI=100000000 
    -DF_CPU=100000000
