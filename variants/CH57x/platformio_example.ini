[platformio]
default_envs = ch570d_evt

[env:ch570d_evt]
platform = ch32v
board = ch570d
framework = arduino
monitor_speed = 115200
build_flags = 
    -DSYSCLK_FREQ_100MHz_HSI=100000000 
    -DF_CPU=100000000

[env:ch572q_evt]
platform = ch32v
board = ch572q
framework = arduino
monitor_speed = 115200
build_flags = 
    -DSYSCLK_FREQ_100MHz_HSI=100000000 
    -DF_CPU=100000000
